<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StreamNest — голосование</title>
<style>  :root { --accent: #8b5cf6; --font: Inter, "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; background: transparent; font: 600 20px/1.3 var(--font); color: #fff; overflow: hidden; }
  .card { margin: 14px; padding: 20px 22px; border-radius: 20px; background: rgba(12,12,20,.78); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.1); box-shadow: 0 16px 40px rgba(0,0,0,.35); transition: opacity .5s, transform .5s; }
  .card.hide { opacity: 0; transform: translateY(20px) scale(.97); }
  .top { display: flex; align-items: center; gap: 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: #c4b5fd; margin-bottom: 6px; }
  .top .timer { margin-left: auto; background: rgba(255,255,255,.1); padding: 3px 10px; border-radius: 20px; font-variant-numeric: tabular-nums; color: #fff; letter-spacing: 0; }
  h1 { margin: 0 0 14px; font-size: 26px; line-height: 1.2; }
  .opt { position: relative; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.06); margin-bottom: 8px; padding: 10px 14px; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent), #22d3ee); background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #22d3ee)); opacity: .55; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .opt .row { position: relative; display: flex; gap: 12px; align-items: center; }
  .opt .num { width: 28px; height: 28px; border-radius: 8px; background: rgba(0,0,0,.35); display: grid; place-items: center; font-weight: 800; font-size: 16px; flex: none; }
  .opt .txt { flex: 1; }
  .opt .pct { font-variant-numeric: tabular-nums; font-weight: 800; }
  .opt.win { box-shadow: 0 0 0 2px #34d399; }
  .opt.win .fill { background: linear-gradient(90deg, #34d399, #22d3ee); }
  .foot { font-size: 14px; color: rgba(255,255,255,.65); margin-top: 6px; }
</style>
</head>
<body>
<div class="card hide" id="card"></div>
<script src="/lang.js"></script><script src="/app/i18n-en.js"></script><script src="/app/i18n.js"></script>
<script src="/overlay/overlay.js"></script>
<script>
const card = document.getElementById('card');
let poll = null, tick = null;
function fmt(ms) { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function render() {
  clearInterval(tick);
  if (!poll || poll.status === 'hidden') { card.classList.add('hide'); return; }
  const ended = poll.status !== 'active';
  card.innerHTML = `<div class="top">📊 ${ended ? 'Итоги голосования' : 'Голосование'}${poll.endsAt && !ended ? `<span class="timer" id="t">${fmt(poll.endsAt - Date.now())}</span>` : ''}</div>
    <h1 data-raw>${esc(poll.question)}</h1>
    ${poll.options.map((o, i) => `<div class="opt ${ended && poll.winner === i ? 'win' : ''}"><div class="fill" style="width:${o.pct}%"></div>
      <div class="row"><span class="num">${i + 1}</span><span class="txt" data-raw>${esc(o.text)}</span><span class="pct">${o.pct}%</span></div></div>`).join('')}
    <div class="foot">${ended ? `Всего голосов: ${poll.total}` : `Пишите номер варианта в чат · голосов: ${poll.total}`}</div>`;
  card.classList.remove('hide');
  if (poll.endsAt && !ended) tick = setInterval(() => { const t = document.getElementById('t'); if (t) t.textContent = fmt(poll.endsAt - Date.now()); }, 500);
}
connect({
  'overlay-config': (c) => document.documentElement.style.setProperty('--accent', c.accent),
  poll: (p) => { poll = p; render(); },
});
</script>
</body>
</html>
