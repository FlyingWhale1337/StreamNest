<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StreamNest — розыгрыш</title>
<style>  :root { --accent: #8b5cf6; --font: Inter, "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; background: transparent; font: 600 20px/1.3 var(--font); color: #fff; overflow: hidden; height: 100%; }
  .card { margin: 14px; padding: 22px; border-radius: 22px; background: rgba(12,12,20,.8); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.1); box-shadow: 0 16px 40px rgba(0,0,0,.35); transition: opacity .5s, transform .5s; text-align: center; position: relative; overflow: hidden; }
  .card.hide { opacity: 0; transform: translateY(20px) scale(.97); }
  .label { font-size: 13px; letter-spacing: 1.4px; text-transform: uppercase; color: #c4b5fd; }
  .prize { font-size: 28px; font-weight: 800; margin: 6px 0 12px; }
  .kw { display: inline-block; background: linear-gradient(135deg, var(--accent), #22d3ee); color: #0b0b14; padding: 6px 14px; border-radius: 12px; font-weight: 800; }
  .count { margin-top: 12px; font-size: 15px; color: rgba(255,255,255,.7); }
  .count b { color: #fff; font-size: 20px; }
  .ticker { margin-top: 10px; height: 26px; font-size: 15px; color: rgba(255,255,255,.8); }
  .ticker span { animation: in .4s; display: inline-block; }
  .roll { margin: 10px 0 4px; height: 70px; display: grid; place-items: center; font-size: 36px; font-weight: 900; border-radius: 14px; background: rgba(255,255,255,.06); }
  .winner { font-size: 40px; font-weight: 900; background: linear-gradient(135deg, #fde68a, var(--accent), #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 8px 0; animation: pop .6s cubic-bezier(.2,.9,.3,1.4); }
  .wmsg { font-size: 16px; color: rgba(255,255,255,.85); margin-top: 6px; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } }
  .confetti { position: absolute; top: -10px; width: 8px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(420px) rotate(720deg); opacity: 0; } }
</style>
</head>
<body>
<div class="card hide" id="card"></div>
<script src="/lang.js"></script><script src="/app/i18n-en.js"></script><script src="/app/i18n.js"></script>
<script src="/overlay/overlay.js"></script>
<script>const card = document.getElementById('card');
let gw = null, lastCount = 0, rollTimer = null, rollingId = null, confettiFor = null;

function confetti() {
  const colors = ['#a78bfa', '#22d3ee', '#fde68a', '#f472b6', '#34d399'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
    c.style.animationDelay = Math.random() * .5 + 's';
    card.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

function playRoll(roll) {
  clearInterval(rollTimer);
  const el = document.getElementById('roll');
  const tick = () => {
    const t = Date.now() - roll.startAt;
    let f = roll.frames[0];
    for (const fr of roll.frames) { if (fr.at <= t) f = fr; else break; }
    if (el.textContent !== f.name) el.textContent = f.name;
  };
  tick();
  rollTimer = setInterval(tick, 25);
}

function render() {
  if (!gw) { clearInterval(rollTimer); rollingId = null; card.classList.add('hide'); return; }
  card.classList.remove('hide');
  if (gw.rolling) {
    if (rollingId === gw.roll.startAt) return;
    rollingId = gw.roll.startAt;
    card.innerHTML = `<div class="label">🎁 <span data-raw>${esc(gw.prize)}</span></div><div class="roll" id="roll" data-raw></div><div class="count">Выбираем победителя…</div>`;
    playRoll(gw.roll);
    return;
  }
  clearInterval(rollTimer);
  const justRevealed = rollingId !== null;
  rollingId = null;
  if (gw.winner) {
    const lastMsg = gw.winnerMessages[gw.winnerMessages.length - 1];
    card.innerHTML = `<div class="label">🎉 Победитель розыгрыша</div><div class="winner" data-raw>${esc(gw.winner.name)}</div>
      <div class="prize" data-raw style="font-size:20px;margin:0">${esc(gw.prize)}</div>
      ${lastMsg ? `<div class="wmsg" data-raw>💬 ${esc(lastMsg.text)}</div>` : ''}`;
    const key = gw.id + gw.winner.name;
    if (justRevealed && confettiFor !== key) { confettiFor = key; confetti(); }
    return;
  }
  const newest = gw.entries.slice(-1)[0];
  card.innerHTML = `<div class="label">🎁 Розыгрыш</div><div class="prize" data-raw>${esc(gw.prize)}</div>
    ${gw.status === 'open' ? `<div>Пиши в чат <span class="kw" data-raw>${esc(gw.keyword)}</span></div>` : '<div>Приём заявок закрыт</div>'}
    <div class="count">Участников: <b>${gw.entries.length}</b></div>
    <div class="ticker">${newest ? `<span data-raw>+ ${esc(newest.name)}</span>` : ''}</div>`;
  lastCount = gw.entries.length;
}
connect({
  'overlay-config': (c) => document.documentElement.style.setProperty('--accent', c.accent),
  giveaway: (g) => { gw = g; render(); },
});
</script>
</body>
</html>
