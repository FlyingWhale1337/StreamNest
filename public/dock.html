<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamNest — док-панель</title>
<style>  :root { --fs: 13px; --bg: #0d0d14; --panel: #15151f; --line: rgba(255,255,255,.08); --muted: #8d8ba3; --tw: #9146ff; --yt: #ff2d55; --accent: #8b5cf6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #ecebf5; font: 500 var(--fs)/1.45 Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .v { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,.05); font-weight: 700; font-variant-numeric: tabular-nums; }
  .v svg { width: 13px; height: 13px; }
  .v.tw svg { color: var(--tw); } .v.yt svg { color: var(--yt); } .v.kk svg { color: #53fc18; }
  .v.total { background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(34,211,238,.18)); }
  .v .eye { opacity: .6; font-weight: 500; }
  .v.off { opacity: .4; }
  .up { margin-left: auto; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .up .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
  .up.live { color: #ff8099; } .up.live .dot { background: #ff2d55; box-shadow: 0 0 8px #ff2d55; animation: p 1.4s infinite; }
  @keyframes p { 50% { opacity: .35; } }

  #feed { flex: 1; overflow-y: auto; padding: 4px 2px 4px 4px; }
  #feed::-webkit-scrollbar { width: 8px; } #feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 8px; }
  .m { position: relative; padding: 3px 6px; border-radius: 6px; word-wrap: break-word; }
  .m:hover { background: rgba(255,255,255,.04); }
  .m.gone { opacity: .35; text-decoration: line-through; }
  .m.hl { background: rgba(139,92,246,.12); box-shadow: inset 2px 0 0 var(--accent); }
  .m.sc { background: rgba(251,191,36,.12); box-shadow: inset 2px 0 0 #fbbf24; }
  .m.sys { color: var(--muted); }
  .m .t { color: #5f5d75; font-size: .85em; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .m .pf { display: inline-grid; place-items: center; width: 1.1em; height: 1.1em; border-radius: 3px; vertical-align: -.2em; margin-right: 3px; }
  .m .pf svg { width: .72em; height: .72em; color: #fff; }
  .pf.twitch { background: var(--tw); } .pf.youtube { background: var(--yt); } .pf.kick { background: #53fc18; } .m .pf.kick svg { color: #0b0b0b; } .pf.system { background: #34344a; }
  .m .b { height: 1.15em; vertical-align: -.22em; margin-right: 2px; border-radius: 2px; }
  .m .n { font-weight: 800; cursor: pointer; }
  .m .e { height: 1.9em; vertical-align: middle; margin: -.35em 0; }
  .m .ev { display: block; font-size: .85em; font-weight: 800; color: #e9d5ff; }
  .mods { display: none; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .always .mods, .m:hover .mods { display: flex; }
  .mods button { border: 1px solid var(--line); background: #1d1d2a; color: #d6d4e6; border-radius: 6px; padding: 2px 7px; font: 600 11px/1.5 inherit; font-family: inherit; cursor: pointer; }
  .mods button:hover { border-color: rgba(255,255,255,.25); color: #fff; }
  .mods button.ban { color: #fca5a5; } .mods button.ban:hover { background: rgba(248,113,113,.15); }
  .mods button.timeout { color: #fcd34d; }
  .mods button.confirm { background: #b91c1c; color: #fff; border-color: transparent; }
  .mods button:disabled { opacity: .5; }

  #down { position: absolute; left: 50%; transform: translateX(-50%); bottom: 52px; display: none; border: 0; background: var(--accent); color: #fff; border-radius: 20px; padding: 4px 12px; font: 600 12px inherit; font-family: inherit; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  form { display: flex; gap: 5px; padding: 6px; border-top: 1px solid var(--line); background: var(--panel); }
  select, input { font: inherit; color: #fff; background: #0b0b12; border: 1px solid rgba(255,255,255,.12); border-radius: 7px; padding: 6px 8px; outline: none; }
  select { width: 34px; padding: 6px 4px; appearance: none; text-align: center; cursor: pointer; }
  input { flex: 1; min-width: 0; }
  input:focus { border-color: var(--accent); }
  form button { border: 0; border-radius: 7px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: #0b0b14; font-weight: 800; padding: 0 11px; cursor: pointer; }
  .toast { position: fixed; left: 8px; right: 8px; bottom: 50px; background: #2a1520; border: 1px solid rgba(248,113,113,.4); color: #fecaca; padding: 6px 10px; border-radius: 8px; font-size: 12px; z-index: 5; }
  .toast.ok { background: #13261f; border-color: rgba(52,211,153,.4); color: #a7f3d0; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 12px; }
</style>
</head>
<body>
<script src="/lang.js"></script><script src="/app/i18n-en.js"></script><script src="/app/i18n.js"></script>
<header id="head"></header>
<div id="feed"><div class="empty">Ждём сообщения…</div></div>
<button id="down">↓ Новые</button>
<form id="send">
  <select id="to" title="Куда отправить"><option value="all">⇄</option><option value="twitch">T</option><option value="youtube">Y</option><option value="kick">K</option></select>
  <input id="text" placeholder="Сообщение в чат…" maxlength="500" autocomplete="off">
  <button title="Отправить">➤</button>
</form>
<script>const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  twitch: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.3 2 3 5.4v13.4h4.6V22h2.6l3.1-3.2h3.7L22 13.9V2zm16 11.1-2.9 2.9h-4.6l-2.5 2.5V16H6.4V3.7h13.9z"/><path d="M15.9 7h1.7v5h-1.7zm-4.6 0H13v5h-1.7z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15V9l5.8 3z"/></svg>',
  kick: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h7v5h2V5h2V3h7v7h-2v1h-2v2h2v1h2v7h-7v-2h-2v-3h-2v5H3z"/></svg>',
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 4v16M4 12h16"/></svg>',
};
const S = { status: { twitch: {}, youtube: {}, twitchStream: {} }, dock: null, stick: true };
const feed = $('#feed');

function nameColor(u) {
  if (u.color && /^#[0-9a-f]{3,8}$/i.test(u.color)) return u.color;
  let h = 7; for (const ch of String(u.name)) h = Math.imul(h ^ ch.charCodeAt(0), 2654435761) >>> 0;
  return `hsl(${h % 360} 70% 68%)`;
}
function fmtNum(n) { return Number(n || 0).toLocaleString(I18N.locale); }
function toast(text, ok) {
  const el = document.createElement('div'); el.className = 'toast' + (ok ? ' ok' : ''); el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), ok ? 1800 : 4000);
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) throw new Error(d.error || r.statusText);
  return d;
}

function renderHead() {
  const tw = S.status.twitch || {}, ts = S.status.twitchStream || {}, yt = S.status.youtube || {}, kk = S.status.kick || {};
  const twOn = tw.state === 'connected', ytOn = yt.state === 'connected', kkOn = kk.state === 'connected';
  const twV = twOn && ts.live ? ts.viewers : null, ytV = ytOn ? (yt.viewers || 0) : null, kkV = kkOn && kk.live ? (kk.viewers || 0) : null;
  const total = (twV || 0) + (ytV || 0) + (kkV || 0);
  const platforms = [tw.channel, yt.target, kk.channel].filter(Boolean).length;
  let up = '<span class="up"><span class="dot"></span>офлайн</span>';
  if (ts.live && ts.startedAt) {
    const sec = Math.floor((Date.now() - new Date(ts.startedAt)) / 1000);
    const hms = `${Math.floor(sec / 3600)}:${String(Math.floor(sec / 60) % 60).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    up = `<span class="up live"><span class="dot"></span>${hms}</span>`;
  } else if (kk.live && kk.startedAt) {
    const sec = Math.floor((Date.now() - new Date(kk.startedAt)) / 1000);
    up = `<span class="up live"><span class="dot"></span>${Math.floor(sec / 3600)}:${String(Math.floor(sec / 60) % 60).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}</span>`;
  } else if (ytOn) up = '<span class="up live"><span class="dot"></span>в эфире</span>';
  const show = S.dock?.showViewers !== false;
  $('#head').innerHTML = (show ? `
    ${tw.channel ? `<span class="v tw ${twV === null ? 'off' : ''}" title="Зрители на Twitch">${ICON.twitch}${twV === null ? '—' : fmtNum(twV)}</span>` : ''}
    ${yt.target ? `<span class="v yt ${ytV === null ? 'off' : ''}" title="Зрители на YouTube">${ICON.youtube}${ytV === null ? '—' : fmtNum(ytV)}</span>` : ''}
    ${kk.channel ? `<span class="v kk ${kkV === null ? 'off' : ''}" title="Зрители на Kick">${ICON.kick}${kkV === null ? '—' : fmtNum(kkV)}</span>` : ''}
    ${platforms > 1 ? `<span class="v total" title="Всего зрителей"><span class="eye">Σ</span>${fmtNum(total)}</span>` : ''}` : '') + up;
}
setInterval(renderHead, 1000);

function canMod(m) {
  return ['twitch', 'kick'].includes(m.platform) && S.status[m.platform]?.canModerate && !m.self && !m.test && !m.user.roles?.broadcaster;
}
function modsHTML(m) {
  if (!canMod(m) || !S.dock?.modButtons?.length) return '';
  return `<div class="mods">${S.dock.modButtons.map(b => `<button class="${b.action}" data-mod="${esc(b.id)}" title="${esc(describe(b))}" data-raw>${esc(b.label)}</button>`).join('')}</div>`;
}
function describe(b) {
  const en = I18N.lang === 'en';
  const u = (en ? { s: 'sec', m: 'min', h: 'h', d: 'd' } : { s: 'сек', m: 'мин', h: 'ч', d: 'дн' })[b.unit];
  return en ? { delete: 'Delete message', ban: 'Ban', unban: 'Unban', timeout: `Timeout for ${b.amount} ${u}` }[b.action]
    : { delete: 'Удалить сообщение', ban: 'Забанить', unban: 'Разбанить', timeout: `Мут на ${b.amount} ${u}` }[b.action];
}
function msgHTML(m) {
  const u = m.user, sys = m.platform === 'system';
  const cls = ['m'];
  if (sys) cls.push('sys');
  if (m.highlight === 'superchat') cls.push('sc'); else if (m.highlight) cls.push('hl');
  const d = S.dock || {};
  const badges = d.showBadges === false ? '' : [...(u.badges || []), ...(u.custom || [])].map(b => `<img class="b" src="${esc(b.url)}" title="${esc(b.title || b.name || '')}">`).join('');
  const parts = (m.parts || []).map(p => p.type === 'emote' ? `<img class="e" src="${esc(p.url)}" title="${esc(p.name)}">` : esc(p.text)).join('');
  const time = d.showTime === false ? '' : `<span class="t">${new Date(m.ts).toLocaleTimeString(I18N.locale, { hour: '2-digit', minute: '2-digit' })}</span>`;
  return `<div class="${cls.join(' ')}" data-id="${esc(m.id)}" data-p="${m.platform}" data-u="${esc(u.id)}" data-name="${esc(u.name)}">
    ${m.eventText ? `<span class="ev">${esc(m.eventText)}</span>` : ''}${time}<span class="pf ${m.platform}">${ICON[m.platform] || ''}</span>${badges}<span class="n" data-raw style="color:${sys ? '#b9a4ff' : esc(nameColor(u))}">${esc(u.name)}</span>${m.action ? ' ' : ': '}<span data-raw>${parts}</span>${modsHTML(m)}</div>`;
}
const store = new Map();
function add(m) {
  if (m.platform === 'system' && !m.botReply) return;
  feed.querySelector('.empty')?.remove();
  store.set(m.id, m);
  feed.insertAdjacentHTML('beforeend', msgHTML(m));
  while (feed.children.length > 250) { store.delete(feed.firstElementChild.dataset.id); feed.firstElementChild.remove(); }
  if (S.stick) feed.scrollTop = feed.scrollHeight;
}
function rerenderAll() {
  const list = [...feed.querySelectorAll('.m')].map(el => store.get(el.dataset.id)).filter(Boolean);
  feed.innerHTML = list.map(msgHTML).join('') || '<div class="empty">Ждём сообщения…</div>';
  feed.scrollTop = feed.scrollHeight;
}
feed.addEventListener('scroll', () => {
  S.stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  $('#down').style.display = S.stick ? 'none' : 'block';
});
$('#down').onclick = () => { feed.scrollTop = feed.scrollHeight; };

const pending = new Map();
feed.addEventListener('click', async (e) => {
  const name = e.target.closest('.n');
  if (name) {
    const m = name.closest('.m');
    const inp = $('#text'); inp.value = `@${m.dataset.name} ` + inp.value.replace(/^@\S+\s/, ''); inp.focus();
    if (m.dataset.p !== 'system') $('#to').value = m.dataset.p;
    return;
  }
  const btn = e.target.closest('[data-mod]');
  if (!btn) return;
  const el = btn.closest('.m');
  const msg = store.get(el.dataset.id);
  const cfg = S.dock.modButtons.find(b => b.id === btn.dataset.mod);
  if (!msg || !cfg) return;
  if (cfg.action === 'ban') {
    const key = el.dataset.id + cfg.id;
    if (!pending.has(key)) {
      const old = btn.textContent; btn.textContent = I18N.t('Точно?'); btn.classList.add('confirm');
      pending.set(key, setTimeout(() => { btn.textContent = old; btn.classList.remove('confirm'); pending.delete(key); }, 3000));
      return;
    }
    clearTimeout(pending.get(key)); pending.delete(key);
  }
  btn.disabled = true;
  try {
    await api('/api/mod', { platform: msg.platform, action: cfg.action, userId: msg.user.id, messageId: msg.id, amount: cfg.amount, unit: cfg.unit, reason: cfg.reason });
    toast(`${describe(cfg)}: ${msg.user.name}`, true);
  } catch (err) { toast(err.message); btn.disabled = false; }
});

$('#send').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('#text').value.trim(); if (!text) return;
  $('#text').value = '';
  try { await api('/api/chat/send', { text, platform: $('#to').value }); } catch (err) { toast(err.message); $('#text').value = text; }
});

function applyDock(d) {
  const prev = JSON.stringify(S.dock);
  S.dock = d;
  document.documentElement.style.setProperty('--fs', (Number(new URLSearchParams(location.search).get('size')) || d.fontSize) + 'px');
  document.body.classList.toggle('always', d.buttonsMode === 'always');
  if (prev !== JSON.stringify(d)) rerenderAll();
  renderHead();
}

(async () => {
  try { const st = await api('/api/state'); S.status = st.status; applyDock(st.config.dock); } catch {}
  const es = new EventSource('/events');
  es.addEventListener('history', (e) => { feed.innerHTML = ''; store.clear(); JSON.parse(e.data).forEach(add); if (!feed.children.length) feed.innerHTML = '<div class="empty">Ждём сообщения…</div>'; });
  es.addEventListener('chat', (e) => add(JSON.parse(e.data)));
  es.addEventListener('chat-remove', (e) => {
    const d = JSON.parse(e.data);
    feed.querySelectorAll('.m').forEach(el => {
      if (el.dataset.p === d.platform && ((d.messageId && el.dataset.id === d.messageId) || (d.userId && el.dataset.u === d.userId))) el.classList.add('gone');
    });
  });
  es.addEventListener('status', (e) => {
    const before = `${!!S.status.twitch?.canModerate}${!!S.status.kick?.canModerate}`;
    Object.assign(S.status, JSON.parse(e.data));
    renderHead();
    if (before !== `${!!S.status.twitch?.canModerate}${!!S.status.kick?.canModerate}`) rerenderAll();
  });
  es.addEventListener('dock-config', (e) => applyDock(JSON.parse(e.data)));
  es.addEventListener('lang', (e) => { if (JSON.parse(e.data).lang !== I18N.lang) location.reload(); });
})();
</script>
</body>
</html>
